name: Lint Frontend

on:
  push:
  pull_request:

jobs:
  lint-frontend:
    name: Lint HTML, CSS and JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint eslint

      - name: Lint HTML
        run: htmlhint "app/src/main/resources/static/**/*.html"

      - name: Lint CSS
        run: stylelint "app/src/main/resources/static/assets/css/*.css"

      - name: Lint JavaScript
        run: eslint "app/src/main/resources/static/assets/js/*.js"
