<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title>Admin Dashboard</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}"/>
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}"/>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}"/>

    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>
<body>
<div class="container">
    <div class="wrapper">
        <div id="header"></div>
        <main class="main-content">
                <input type="text" id="searchBar" placeholder="search doctor by name" class="searchBar"/>
                <div id="filters" class="filter-wrapper">
                    <select id="sortByTime" class="filter-select">
                        <option>AM</option>
                        <option>PM</option>
                    </select>
                    <select id="filterBySpecialty" class="filter-select">
                        <option>Filter by specialty</option>
                        <option>Cardiologist</option>
                        <option>Neurologist</option>
                        <option>Orthopedist</option>
                        <option>Pediatrician</option>
                        <option>Dermatologist</option>
                    </select>
                </div>
            <div id="content"></div>
        </main>
        <div id="footer"></div>
    </div>
</div>
<div id="modal" class="modal">
    <span id="closeModal" class="close">&times;</span>
    <div id="modal-body"></div>
</div>
<script type="module" th:src="@{/js/adminDashboard.js}" defer></script>

</body>
</html>
